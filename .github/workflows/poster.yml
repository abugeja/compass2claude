name: Poster

# Runs compass_post.py against the data in this repo, then commits the
# updated state back. Used by the cloud setup (docs/cloud.md), in your
# PRIVATE data repo only.
#
# It does nothing until you set the repository variable POSTER_ENABLED to
# true (Settings > Secrets and variables > Actions > Variables), so it never
# runs in a public copy of this repo.

on:
  schedule:
    # Every 30 minutes, 6am to 9:30pm Melbourne (covers both AEST and AEDT).
    - cron: "*/30 19-23,0-11 * * *"
  push:
    branches: [main]
    paths: ["outbox/**"]
  workflow_dispatch:

# One run at a time; a second one waits rather than racing on the state files.
concurrency:
  group: poster
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    if: vars.POSTER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write local settings from secrets
        env:
          CONFIG_INI: ${{ secrets.CONFIG_INI }}
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: |
          if [ -z "$CONFIG_INI" ]; then
            echo "::error::Secret CONFIG_INI is not set. See README.md."
            exit 1
          fi
          if [ -z "$PRIVATE_TERMS" ]; then
            echo "::error::Secret PRIVATE_TERMS is not set. Refusing to run without the blocked-words list."
            exit 1
          fi
          printf '%s\n' "$CONFIG_INI" > config.ini
          printf '%s\n' "$PRIVATE_TERMS" > private_terms.txt

      - name: Run the poster
        run: python compass_post.py

      - name: Show the log
        if: always()
        run: tail -n 40 compass_post.log || true

      - name: Save state
        if: always()
        run: |
          git config user.name "poster"
          git config user.email "poster@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Poster run $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Could not push the updated state."
          exit 1
