; Copy this file to config.ini and fill it in. config.ini is git-ignored
; and must stay on this computer: it holds your bot token and passwords.

[telegram]
; From @BotFather (/newbot).
bot_token = 123456789:REPLACE_ME
; The channel the bot posts to. Public channel: @username. Private channel:
; post anything in it, then run  python compass_post.py --whoami  and use
; the -100... number shown with "channel".
channel_id = -100REPLACE_ME
; Your own Telegram chat id. Needed for approvals and private notes.
; Send the bot a direct message, run --whoami, and use the number shown
; with "private".
private_chat_id =

[school]
; Shown on posts as the audience label for year-level and class emails.
year_label = Prep
class_label = Prep class
; IANA timezone used for dates, quiet hours and calendar events.
timezone = Australia/Melbourne

[group]
; Every channel post comes to you first with Post / Skip buttons.
; Set to false only once you trust it.
review = true
; Audiences allowed in the channel. Everything else goes to you only.
audiences = school, prep, class
; Only links on these domains may appear in the channel. Never add the
; Compass site: its links carry your personal login token.
link_allowlist = compasstix.com
; No channel posts between these hours (24h, start-end).
quiet_hours = 20-7
; Kinds that post straight to the channel without approval. Guardrails
; still apply. Leave empty to approve everything, or e.g.:
;   auto_post_kinds = newsletter, reminder
auto_post_kinds =
; While posts await approval, keep listening for button taps for this many
; seconds after each cycle (keep it under your schedule interval).
listen_seconds = 540

; Optional: add dates to an iCloud calendar. Uncomment and fill in.
; app_password is an app-specific password from account.apple.com
; (Sign-In and Security > App-Specific Passwords), not your Apple ID password.
; [icloud]
; apple_id = you@example.com
; app_password = xxxx-xxxx-xxxx-xxxx
; calendar_name = Family
